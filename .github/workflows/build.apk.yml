name: Build Android APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Get the code
        uses: actions/checkout@v4

      - name: Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Android SDK
        uses: android-actions/setup-android@v3

      - name: Copy the website files into www
        run: |
          mkdir -p www
          for f in index.html app.js style.css config.js; do
            if [ ! -f "$f" ]; then echo "ERROR: $f is missing in the repository root"; exit 1; fi
            cp "$f" www/
          done
          for f in sw.js manifest.json icon.svg icon-192.png icon-512.png; do
            if [ -f "$f" ]; then cp "$f" www/; fi
          done
          ls -la www

      - name: Install Capacitor
        run: npm install

      - name: Create the Android project
        run: npx cap add android

      - name: Allow microphone, camera and notifications
        run: |
          MANIFEST=android/app/src/main/AndroidManifest.xml
          sed -i 's#</manifest>#    <uses-permission android:name="android.permission.CAMERA" />\n    <uses-permission android:name="android.permission.RECORD_AUDIO" />\n    <uses-permission android:name="android.permission.MODIFY_AUDIO_SETTINGS" />\n    <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />\n</manifest>#' "$MANIFEST"
          grep -n "uses-permission" "$MANIFEST"

      - name: Copy web files into the Android project
        run: npx cap sync android

      - name: Build the APK
        working-directory: android
        run: |
          chmod +x ./gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Save the APK so you can download it
        uses: actions/upload-artifact@v4
        with:
          name: NTalk-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
